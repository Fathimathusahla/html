<html>
<body bgcolor="pink">
<h1><center><i>MATHS AND STRING FUNCTION</i></center>
<script>
var a="Hello";
var b=" How are";
var c="mm you";
var d=a+b+c;
document.write("string1=" + a +"<br></br>");
document.write("string2=" + b +"<br></br>");
document.write("string3=" + c +"<br></br>");
document.write("<h2>STRING FUNCTIONS</h2>");
document.write("Concatination = "+ a + b + c +"<br></br>");
document.write("length="+ d.length +"<br></br>");
document.write("UpperCase="+ d.toUpperCase() +"<br></br>");
document.write("LowerCase="+ d.toLowerCase() +"<br></br>");
document.write("slice="+ d.slice(1,7) +"<br></br>");
document.write("replace="+ c.replace("you","my") +"<br></br>");
document.write("<h2>MATH FUNCTIONS</h2>");
document.write("Square root of 25=" + Math.sqrt(25) +"<br>");
document.write("power=" + Math.pow(2,3) +"<br>");
document.write("absolute value of -10=" + Math.abs(-10) +"<br>");
document.write("Round=" + Math.round(4.6) +"<br>");
document.write("floor=" + Math.floor(4.6) +"<br>");
document.write("ceil=" + Math.ceil(4.6) +"<br>");
document.write("minimum=" + Math.min(4,6,10) +"<br>");
document.write("maximum=" + Math.max(4,6,10) +"<br>");
</script>
</body>
</html>
