<html>
<body>
<h2>FORM VALIDATION</h2>
<form method="POST" onsubmit="return validateForm();">
<label>Name:</label>
<input type="text" name="name" id="name">
<br><br>
<label>Email:</label>
<input type="email" name="email" id="email">
<br><br>
<label>Password:</label>
<input type="password" name="password" id="password">
<br><br>
<label>Age:</label>
<input type="number" name="age" id="age">
<br><br>
<label>Gender:</label>
<input type="radio" name="gender" value="male">Male
<input type="radio" name="gender" value="female">Female
<br><br>
<label>Course:</label>
<select name="course" id="course">
	<option>MCA</option>
	<option>MBA</option>
	<option>M.TECH</option>
	<option>BCA</option>
</select>
<br><br>
<label>Hobbies:</label>
<input type="checkbox" name="hobby" value="reading">Reading
<input type="checkbox" name="hobby" value="drawing">Drawing
<input type="checkbox" name="hobby" value="Music">Music
<br><br>
<label>Address:</label><br>
<textarea name="address" rows="4" cols="30"></textarea>
<br><br>
<label>Date Of Birth:</label>
<input type="date" name="dob" id="dob">
<br><br>
<input type="submit" value="Register">
</form>
<script>
function validateForm()
{
	var name=document.getElementById("name").value;
	var email=document.getElementById("email").value;
	var password=document.getElementById("password").value;
	var age=document.getElementById("age").value;
	var gender=document.getElementByName("gender").value;
	var course=document.getElementById("course").value;
	var hobbies=document.getElementByName("hobbies").value;
	var address=document.getElementByName("address").value;
	var dob=document.getElementById("dob").value;
	var msg="";
	var selected=false;
	if(name=="")
	{
		msg+="Enter your name\n";
	} 
	if(email=="")
	{
		msg+="Enter Email\n";
	} 
	if(password=="")
	{
		msg+="Enter password\n";
	} 
	if(age=="")
	{
		msg+="enter age\n";
	}
	if(gender=="")
	{
		msg+="enter your gender\n";
	} 
	if(course=="")
	{
		msg+="Enter your course\n";
	} 
	if(hobbies=="")
	{
		msg+="Enter your hobby\n";
	} 
	for(var i=0;i<hobby.length;i++)
	{
		if(hobby[i].checked)
		{
			selected=true;
		}
	}
	if(selected=false) 
	{
		msg+="select atleast one";
	}
	if(address=="")
	{
		msg+="Enter your address\n";
	} 
	if(dob=="")
	{
		msg+="Enter your Date of Birth\n";
	} 

}
</script>
</body>
</html>
